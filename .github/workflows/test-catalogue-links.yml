name: Test Catalogue Links

on:
  push:
    branches: [ main ]
    paths:
      - 'data/catalogue.json'
      - 'tests/test_catalogue_links.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'data/catalogue.json'
      - 'tests/test_catalogue_links.py'
  workflow_dispatch:

jobs:
  test-links:
    runs-on: ubuntu-latest
    name: Validate catalogue.json links

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run catalogue link tests
      run: |
        python -m pytest tests/test_catalogue_links.py -v --tb=short

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          .pytest_cache/
